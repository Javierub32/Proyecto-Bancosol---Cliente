<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignación de Turno</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/formularioTurno.css" />
</head>
<body class="formulario-turno-page">

    <include-html src="./components/navbar.html"></include-html>

    <div style="display: flex; flex-direction: row">
        <div class="form-turno">
            <div class="turno-info" id="header-info">
                <!-- Se rellena con JS -->
            </div>

            <form id="turno-form">
                <input type="hidden" id="turno_id" name="id">
                <input type="hidden" id="tiendaCampanyaId" name="tiendaCampanyaId">
                <input type="hidden" id="tipoTurnoId" name="tipoTurnoId">
                <input type="hidden" id="lineal" name="lineal">

                <div class="form-group">
                    <label for="input_colaboradores">Colaborador:</label>
                    <select id="input_colaboradores" name="idColaborador">
                        <option value="0">Seleccione un colaborador...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="input_num_voluntarios">Número de voluntarios:</label>
                    <input id="input_num_voluntarios" type="number" name="numVoluntarios">
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="input_hora_inicio">Hora Inicio:</label>
                        <input id="input_hora_inicio" type="time" name="horaInicio">
                    </div>
                    <div class="form-group">
                        <label for="input_hora_fin">Hora Fin:</label>
                        <input id="input_hora_fin" type="time" name="horaFin">
                    </div>
                </div>

                <div class="form-group">
                    <label for="input_observaciones">Observaciones:</label>
                    <textarea id="input_observaciones" name="observaciones" rows="4"></textarea>
                </div>

                <button type="submit" class="btn-submit">Guardar Turno</button>
            </form>
        </div>
        <div id="colaborador_container" class="card panel-colaborador">
            <div class="empty-colaborador-msg">
                Seleccione un colaborador para ver su información
            </div>
        </div>
    </div>

   <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tiendaId = urlParams.get('id');
        const turnoId = urlParams.get('turno');
        const lineal = urlParams.get('lineal');

        const form = document.getElementById('turno-form');
        const selectColaboradores = document.getElementById('input_colaboradores');
        const colaboradorContainer = document.getElementById('colaborador_container');

		// Lista de colaboradores en memoria para evitar múltiples llamadas a la API
        let listaColaboradores = [];

        async function initPage() {
            try {
                // Consultamos la lista de colaboradores
                const responseColaboradores = await fetch('https://proyecto-bancosol.onrender.com/api/colaboradores/');
                
                if (responseColaboradores.ok) {
                    listaColaboradores = await responseColaboradores.json();
                    
                    listaColaboradores.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.id;
                        opt.textContent = c.nombre;
                        selectColaboradores.appendChild(opt);
                    });
                } else {
                    console.error("Error al cargar los colaboradores");
                }

                // Consultamos el turno, si existe
                const responseTurno = await fetch(`https://proyecto-bancosol.onrender.com/api/asignacionTurnos/buscarTurno/${tiendaId}/${turnoId}/${lineal}`);

                let turnoData = null;
                if (responseTurno.ok) {
                    const textData = await responseTurno.text();
                    if (textData) turnoData = JSON.parse(textData);
                } else {
					console.error("Error al cargar el turno:", responseTurno.statusText);
				}


                // Consultamos los datos de la tienda
                const responseTienda = await fetch(`https://proyecto-bancosol.onrender.com/api/tiendas/buscarTiendaCampanya/${tiendaId}`);
                
				if (!responseTienda.ok) {
					console.error("Error al cargar la tienda:", responseTienda.statusText);
				}

				const tiendaData = await responseTienda.json();



				// Consultamos el nombre del turno
				const responseTipoTurno = await fetch(`https://proyecto-bancosol.onrender.com/api/tipoTurno/${turnoId}`);

                if (!responseTipoTurno.ok) {
					console.error("Error al cargar el tipo de turno:", responseTipoTurno.statusText);
				}
				const tipoTurnoData = await responseTipoTurno.json();


                const nombreTienda = tiendaData?.tienda?.nombre || "Tienda no encontrada";
                const domTienda = tiendaData?.tienda?.domicilio || "";
                const nombreTurno = tipoTurnoData?.nombre || "Turno " + turnoId;

                renderHeaderInfo(nombreTienda, domTienda, nombreTurno, lineal);

                // Rellenamos el formulario si existía turno
                if (turnoData) {
                    document.getElementById('turno_id').value = turnoData.id;
                    selectColaboradores.value = turnoData.colaborador.id || 0;
                    document.getElementById('input_num_voluntarios').value = turnoData.numVoluntarios || '';
                    document.getElementById('input_hora_inicio').value = turnoData.horaInicio || '';
                    document.getElementById('input_hora_fin').value = turnoData.horaFin || '';
                    document.getElementById('input_observaciones').value = turnoData.observaciones || '';
                    
                    renderColaboradorInfo(turnoData.colaborador.id);
                } else {
                    renderColaboradorInfo(0);
                }

                // Datos ocultos para enviar al guardar
                document.getElementById('tiendaCampanyaId').value = tiendaId;
                document.getElementById('tipoTurnoId').value = turnoId;
                document.getElementById('lineal').value = lineal;
                
            } catch (error) {
                console.error("Error crítico cargando la página:", error);
            }
        }


        selectColaboradores.addEventListener("change", (e) => {
            renderColaboradorInfo(e.target.value);
        });

        // Guardamos el turno al hacer submit en el formulario
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                idTurno: document.getElementById('turno_id').value,
                idTiendaCampanya: document.getElementById('tiendaCampanyaId').value,
                idTipoTurno: document.getElementById('tipoTurnoId').value,
                lineal: document.getElementById('lineal').value,
                idColaborador: selectColaboradores.value,
                numVoluntarios: document.getElementById('input_num_voluntarios').value || null,
                horaInicio: document.getElementById('input_hora_inicio').value || null,
                horaFin: document.getElementById('input_hora_fin').value || null,
                observaciones: document.getElementById('input_observaciones').value || null
            };

            try {
                const response = await fetch('https://proyecto-bancosol.onrender.com/api/asignacionTurnos/guardar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                window.location.href = '/html/asignacion_turno.html';
            } catch (error) {
                console.error("Error guardando el turno: ", error);
            }
        });

		function renderHeaderInfo(tienda, domicilio, turno, lineal) {
            document.getElementById('header-info').innerHTML = `
                <div class="turno-info-row">
                    <span>${tienda} - <span class="text-mutex">${domicilio}</span></span>
                    <span>${turno}</span>
                </div>
                <div class="turno-info-row">
                    <span></span>
                    <span>Lineal ${lineal}</span>
                </div>
            `;
        }

        // Pintamos el panel lateral con la información del colaborador asignado al turno
        function renderColaboradorInfo(idColaborador) {
            if (!idColaborador || idColaborador == 0) {
                colaboradorContainer.innerHTML = "<div style='color: gray; font-style: italic; text-align: center; margin-top: 20px;'>No hay colaborador seleccionado</div>";
                return;
            }

            // Buscamos el colaborador en nuestro array en memoria
            const col = listaColaboradores.find(c => c.id == idColaborador);
            
            if (!col) return;

            let contactosHtml = '';
            if (col.contactos && col.contactos.length > 0) {
                contactosHtml = col.contactos.map(c => `
                    <div class="info-card">
                        <div class="info-header">
                            <div class="info-main">
                                <p class="lbl-capitan">${c.nombre}</p>
                            </div>
                            <div class="info-side">
                                <div>TELÉFONO</div>
                                <div>${c.telefono || "--"}</div>
                            </div>
                        </div>
                        <div class="info-body">
                            <p><strong>Email: </strong>${c.email || "--"}</p>
                        </div>
                    </div>
                `).join('');
            } else {
                contactosHtml = `<p class="text-muted" style="font-size: 0.85rem;">No hay contactos registrados.</p>`;
            }

            colaboradorContainer.innerHTML = `
                <div id="colaborador-localization">
                    <p id="lbl-colaborador">${col.nombre}</p>
                    <p id="lbl-domicilio">${col.domicilio || '--'}</p>
                    <p class="text-muted">${col.codigo || '--'}, ${col.localidadSede ? col.localidadSede.nombre : '--'}</p>
                    <p class="text-muted">Colabora en: ${col.colaboraEn ? col.colaboraEn.nombre : '--'}</p>
                </div>
                <div id="colaborador-schedule">
                    <div id="contactosCard">
                        ${contactosHtml}
                    </div>
                    <div id="colaborador-observaciones">
                        <p class="section-title">Observaciones</p>
                        <div class="info-card">
                            <div class="info-body">
                                <p>${col.observaciones ? col.observaciones : "Sin observaciones"}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Iniciamos la función
        initPage();
    </script>
</body>
</html>
